<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)"><meta name="color-scheme" content="light dark"><title>INTERVIEW SLOT BOOKING</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5 3 3 5-5"/></svg></span><h1>INTERVIEW SLOT BOOKING</h1></div></header>
<section id="app"><p id="message" class="message" role="status" aria-live="polite"></p><div id="rescheduleBanner" class="reschedule-banner hidden"><p id="rescheduleText"></p><button id="stopReschedule" class="quiet">Cancel move</button></div>
<section class="card calendar"><div class="calendar-heading"><button id="prevMonth" class="icon" aria-label="Previous month">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" class="icon" aria-label="Next month">›</button></div><div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendarGrid" class="calendar-grid"></div><div class="legend"><span><i class="demo-dot"></i>Demo</span><span><i class="interview-dot"></i>Interview</span><span><i class="available-dot"></i>Available</span></div></section>
<section class="card times"><div class="section-heading"><div><p class="eyebrow">SELECT A SLOT</p><h2 id="dateTitle"></h2></div><button id="refresh" class="quiet">Refresh</button></div><div class="timezone-box"><label for="timezoneSelect">Show slot times in<select id="timezoneSelect" aria-label="Select display timezone"></select></label><p id="timezoneHint" class="hint"></p></div><p class="hint">Calendar dates and Morning / Afternoon / Evening / Night groups follow IST. Operating hours: 7 AM to 3 AM IST the following day.</p><div id="periods" class="period-tabs" role="tablist" aria-label="Time of day"></div><div id="slotGrid" class="slot-grid" role="tabpanel" aria-label="30-minute slots"></div></section></section></main>
<dialog id="slotDialog"><div class="dialog-content"><button class="close" data-close="slotDialog" aria-label="Close slot">×</button><p class="eyebrow">BOOKED SLOT</p><h2 id="slotTitle"></h2><p id="slotCapacity" class="hint"></p><div id="slotBookings"></div><p id="slotError" class="error" role="alert"></p><button id="addAnother" class="primary">Book second appointment</button></div></dialog>
<dialog id="bookingDialog"><div class="dialog-content"><button class="close" data-close="bookingDialog" aria-label="Close booking">×</button><p class="eyebrow">30-MINUTE BOOKING</p><h2 id="formTitle">Book slot</h2><p id="selectedTime" class="selected-time"></p><form id="bookingForm"><label>Booking type<select id="bookingType" required><option value="">Choose demo or interview</option><option value="demo">Demo</option><option value="interview">Interview</option></select></label><label>Member name<input id="memberName" required maxlength="100" autocomplete="name"></label><label>WhatsApp number<input id="whatsapp" type="tel" required maxlength="30" autocomplete="tel" placeholder="+91 9876543210"></label><label>Interview company name<input id="company" required maxlength="150"></label><label>Experience<input id="experience" required maxlength="100" placeholder="e.g. 4 years 6 months"></label><label>Interview stage<input id="interviewStage" required maxlength="100" placeholder="e.g. Demo, Technical L1, L2, HR"></label><label>Member timezone<select id="memberTimezone" required></select></label><label>Notes <span class="optional">Optional</span><textarea id="notes" maxlength="2000" rows="3" placeholder="Add any booking details or reminders"></textarea></label><p id="memberLocalTime" class="hint"></p><p id="bookingError" class="error" role="alert"></p><button id="saveBooking" class="primary" type="submit">Save booking</button></form></div></dialog>
<script src="schedule.js"></script><script src="admin.js"></script></body></html>
