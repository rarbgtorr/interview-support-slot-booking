<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>My bookings · Interview Slot Booking</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell member-shell"><header class="topbar"><h1>MY BOOKINGS</h1><a class="quiet manage-link" href="/">Book a slot</a></header>
<section id="loginCard" class="card login"><h2>Manage your bookings</h2><p class="hint">Log in with the email you entered while booking. We’ll send you a one-time code.</p><form id="emailForm"><label>Email address<input id="loginEmail" type="email" required maxlength="254" autocomplete="email"></label><p id="loginError" class="error" role="alert"></p><button id="sendOtp" class="primary">Send OTP</button></form></section>
<section id="otpCard" class="card hidden"><h2>Check your email</h2><p class="hint">Enter the code sent to <strong id="otpEmail"></strong>.</p><form id="otpForm"><label>Verification code<input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required></label><p id="otpError" class="error" role="alert"></p><button id="verifyOtp" class="primary">Verify and log in</button></form><div class="booking-actions"><button id="resendOtp" class="quiet" type="button">Resend OTP</button><button id="changeEmail" class="quiet" type="button">Change email</button></div></section>
<section id="dashboard" class="hidden"><section class="card member-account"><p id="memberEmail"></p><button id="memberLogout" class="quiet">Logout</button></section><p id="memberMessage" class="message" role="status" aria-live="polite"></p><section class="card"><h2>Upcoming bookings</h2><div id="upcomingBookings"></div></section><section class="card"><h2>Booking history</h2><div id="historyBookings"></div></section></section></main>
<dialog id="rescheduleDialog" aria-labelledby="rescheduleTitle"><div class="dialog-content"><button id="closeReschedule" class="close" aria-label="Close reschedule">×</button><h2 id="rescheduleTitle">Reschedule booking</h2><p id="originalTime" class="hint"></p><p class="hint">Your current slot stays booked until you save a new time.</p><form id="rescheduleForm"><label>Booking date (IST)<input id="moveDate" type="date" required></label><label>Show times in<select id="moveTimezone"></select></label><div id="movePeriods" class="period-tabs" role="tablist" aria-label="Time of day"></div><div id="moveSlots" class="slot-grid" role="tabpanel" aria-label="Available slots"></div><p id="moveSelection" class="selected-time"></p><p id="moveError" class="error" role="alert"></p><button id="saveMove" class="primary" disabled>Save new time</button></form></div></dialog>
<script src="/schedule.js"></script><script src="/member.js"></script></body></html>
